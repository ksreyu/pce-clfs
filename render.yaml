services:
  - type: web
    name: pce-clfs
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install --include=dev && npx vite build && cd ../backend && npm install && npx prisma generate && npx prisma db push --force-reset && npx tsx prisma/seed.ts
    startCommand: cd backend && npx tsx src/index.ts
    envVars:
      - key: DATABASE_URL
        value: "file:./prod.db"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: PORT
        value: "5000"
